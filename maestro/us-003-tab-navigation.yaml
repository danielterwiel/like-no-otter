# US-003: Tab navigation with Expo Router
# Verifies 4 tabs visible and navigable

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Verify all 4 tabs are visible
- assertVisible:
    text: "Today"

- assertVisible:
    text: "Health"

- assertVisible:
    text: "Workouts"

- assertVisible:
    text: "Tasks"

# Test tab navigation
- tapOn:
    text: "Health"

- assertVisible:
    id: "screen-health"

- tapOn:
    text: "Workouts"

- assertVisible:
    id: "screen-workouts"

- tapOn:
    text: "Tasks"

- assertVisible:
    id: "screen-tasks"

- tapOn:
    text: "Today"

- assertVisible:
    id: "screen-today"
