# US-021: Error handling and offline support
# Verifies offline resilience

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Verify app launches and functions (basic offline test)
# Full offline testing requires device-level network simulation

# Navigate through tabs to verify app is responsive
- tapOn:
    text: "Health"

- assertVisible:
    id: "health-tab"
    optional: true

- tapOn:
    text: "Workouts"

- assertVisible:
    id: "workouts-tab"
    optional: true

- tapOn:
    text: "Tasks"

- assertVisible:
    id: "tasks-tab"
    optional: true
# App should not crash and should show cached data when offline
