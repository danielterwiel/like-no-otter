# US-009: Workout setup screen
# Verifies exercise search and queue functionality

appId: com.likenootter.app

---
- launchApp

- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 30000

# Navigate to Workouts tab
- tapOn:
    text: "Workouts"

# Verify start workout button is visible
- assertVisible:
    id: "start-workout-button"

# Open workout setup modal
- tapOn:
    id: "start-workout-button"

# Verify we're on the workout setup screen
- assertVisible:
    id: "screen-workout-setup"

# Verify search input is visible
- assertVisible:
    id: "exercise-search-input"

# Search for an exercise
- tapOn:
    id: "exercise-search-input"

- inputText: "squat"

# Wait for search results
- extendedWaitUntil:
    visible:
      id: "exercise-list"
    timeout: 5000

# Tap on Barbell Squat to add to queue
- tapOn:
    text: "Barbell Squat"

# Verify exercise appears in queue
- assertVisible:
    id: "workout-queue"

# Verify the queue item exists
- assertVisible:
    text: "Workout Queue (1)"

# Search and add another exercise
- clearText:
    id: "exercise-search-input"

- inputText: "bench"

# Tap on Barbell Bench Press
- tapOn:
    text: "Barbell Bench Press"

# Verify queue count increased
- assertVisible:
    text: "Workout Queue (2)"

# Verify Start Workout button is now active (check by tapping it)
- tapOn:
    id: "start-workout-button"
