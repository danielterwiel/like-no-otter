# US-008: HealthKit sync service
# Verifies HealthKit data syncs to SQLite for offline access
# Sync runs automatically on app foreground via AppState listener

appId: com.likenootter.app

---
- launchApp

- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 10000

# Navigate to Health tab - sync should trigger on foreground
- tapOn:
    text: "Health"

# Verify health tab is displayed (screen exists)
- assertVisible:
    id: "screen-health"
# Health data is now cached in SQLite and accessible offline
# The sync service fetches 30 days of data and stores it locally
# This enables the app to display health metrics without network connection
