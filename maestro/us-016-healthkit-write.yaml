# US-016: Write workout to HealthKit
# Verifies workout sync status after saving

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Navigate to Workouts tab
- tapOn:
    text: "Workouts"

# Verify sync status indicator is visible (when implemented)
- assertVisible:
    id: "healthkit-sync-status"
    optional: true

# After completing a workout, verify HealthKit sync status
- assertVisible:
    text: "Synced"
    optional: true
