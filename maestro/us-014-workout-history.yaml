# US-014: Workout history list
# Verifies history list and workout cards

appId: com.likenootter.app

---
- launchApp

- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 10000

# Navigate to Workouts tab
- tapOn:
    text: "Workouts"

# Verify workout history list is visible
- assertVisible:
    id: "workout-history"

# Verify Recent Workouts header
- assertVisible:
    text: "Recent Workouts"

# Verify Exercise Library card
- assertVisible:
    text: "Exercise Library"

# Verify Start Workout button
- assertVisible:
    id: "start-workout-button"

# Verify empty state when no workouts exist
- assertVisible:
    text: "No workouts yet"
    optional: true

# If there is a workout card, test navigation to detail view
- tapOn:
    id: "workout-card"
    optional: true

- assertVisible:
    id: "workout-detail"
    optional: true
