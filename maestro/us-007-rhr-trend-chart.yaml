# US-007: RHR trend chart
# Verifies RHR chart renders on Health tab

appId: com.likenootter.app

---
- launchApp

- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 10000

# Navigate to Health tab
- tapOn:
    text: "Health"

- assertVisible:
    id: "screen-health"

# Verify RHR trend chart card is visible
- assertVisible:
    id: "rhr-trend-chart"

# Verify chart header text
- assertVisible:
    text: "RHR Trend"

- assertVisible:
    text: "Last 7 days"

# Verify either chart content, empty state, or web message is shown
# (depends on platform and available data)
- runFlow:
    when:
      visible:
        id: "rhr-trend-empty"
    commands:
      - assertVisible:
          text: "Not enough data"

- runFlow:
    when:
      visible:
        id: "rhr-trend-web"
    commands:
      - assertVisible:
          text: "Chart available on iOS"
