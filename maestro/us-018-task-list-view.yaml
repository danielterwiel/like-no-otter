# US-018: Task list view
# Verifies section grouping (Today, Upcoming, Done)

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Navigate to Tasks tab
- tapOn:
    text: "Tasks"

# Verify we're on the tasks screen
- assertVisible:
    id: "screen-tasks"

# Verify section headers are visible
- assertVisible:
    id: "section-header-today"

- assertVisible:
    id: "section-header-upcoming"

- assertVisible:
    id: "section-header-done"

# Verify section header text content
- assertVisible:
    text: "Today"

- assertVisible:
    text: "Upcoming"

- assertVisible:
    text: "Done"

# Verify task list container (when tasks exist)
- assertVisible:
    id: "task-list"
    optional: true
