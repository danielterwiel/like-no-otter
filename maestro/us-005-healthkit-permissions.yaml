# US-005: HealthKit permissions flow
# Verifies onboarding flow for HealthKit authorization
# Note: On web/non-iOS, onboarding is skipped. On iOS, onboarding shows on first launch.

appId: com.likenootter.app

---
- launchApp

# Wait for app to be ready (either onboarding or main app)
# On iOS first launch: healthkit-onboarding is shown
# On web/non-iOS or after onboarding: app-ready is shown
- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 10000

# Verify we can reach the Health tab
- tapOn:
    text: "Health"

- assertVisible:
    id: "screen-health"

# Verify the health screen shows appropriate content
# On iOS with denied auth: healthkit-denied is shown
# On web or authorized: screen-health placeholder is shown
- assertVisible:
    text: "Health"
