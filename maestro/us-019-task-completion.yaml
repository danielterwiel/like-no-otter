# US-019: Task completion with swipe
# Verifies checkbox toggle and swipe to complete

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Navigate to Tasks tab
- tapOn:
    text: "Tasks"

- assertVisible:
    id: "screen-tasks"

# First create a task to test completion
- tapOn:
    id: "add-task-button"

# Enter task title
- tapOn:
    id: "task-title-input"

- inputText: "Test task for completion"

# Save the task
- tapOn:
    id: "save-task-button"

# Wait for return to task list
- assertVisible:
    id: "task-list"

# Verify task appears in Today or Upcoming section
- assertVisible:
    text: "Test task for completion"

# Test checkbox completion by tapping the checkbox
# Note: task-checkbox-{id} is dynamic, use first checkbox found
- tapOn:
    text: "Test task for completion"
    optional: true

# Expand Done section to see completed task
- tapOn:
    id: "section-header-done"

# Verify Done section header is visible
- assertVisible:
    id: "section-header-done"

# Test uncomplete by tapping again (optional - task may have moved)
- tapOn:
    text: "Test task for completion"
    optional: true
