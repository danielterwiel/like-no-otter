# US-004: Seed exercise database
# Verifies exercises are seeded and search UI is present

appId: com.likenootter.app

---
- launchApp

- assertVisible:
    id: "app-ready"

# Navigate to Workouts tab
- tapOn:
    text: "Workouts"

# Verify we're on the Workouts screen
- assertVisible:
    id: "screen-workouts"

# Verify exercise count is displayed (shows exercises were seeded)
- assertVisible:
    id: "exercise-count"

# Verify search input is present
- assertVisible:
    id: "exercise-search-input"
