# US-007: TickTick bidirectional sync
# Tests the TickTick sync infrastructure and UI components

appId: com.likenootter.app

---
# Wait for app to be ready
- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 10000

# Navigate to More tab
- tapOn:
    id: "screen-more"
    optional: true
- tapOn:
    text: "More"

# Verify More tab is displayed
- assertVisible:
    id: "screen-more"
- assertVisible:
    id: "connections-section"

# Verify TickTick connection card is visible
- assertVisible:
    id: "connection-card-ticktick"

# Verify TickTick shows disconnected status initially
- assertVisible:
    id: "connection-status-ticktick-disconnected"

# Tap on TickTick to open connect screen
- tapOn:
    id: "connection-card-ticktick"

# Verify TickTick connect screen loads
- assertVisible:
    text: "Connect TickTick"
    optional: true
- assertVisible:
    text: "TickTick"

# Verify bidirectional sync info is shown
- assertVisible:
    text: "Import"
    optional: true
- assertVisible:
    text: "Sync"
    optional: true

# Verify connect button is available
- assertVisible:
    text: "Connect"
    optional: true

# Go back to More screen
- tapOn:
    text: "Cancel"
    optional: true
- back

# Verify we're back on More screen
- assertVisible:
    id: "screen-more"

# Navigate to Tasks tab to verify task list works
- tapOn:
    text: "Tasks"

# Verify tasks screen is displayed
- assertVisible:
    id: "screen-tasks"
    optional: true

# Verify section headers are visible (Today, Upcoming, Done)
- assertVisible:
    id: "section-header-today"
    optional: true
- assertVisible:
    id: "section-header-upcoming"
    optional: true
# Test passes - TickTick sync infrastructure is in place
